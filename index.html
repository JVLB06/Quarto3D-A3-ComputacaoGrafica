    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Reticle Gaze Cursor styling */
        #reticle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stereo-active #reticle-container {
            display: none; /* In Stereo mode, reticle is drawn in 3D scene */
        }
        .reticle-ring {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: absolute;
            transition: transform 0.1s linear, border-color 0.2s ease;
        }
        .reticle-dot {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        .reticle-progress {
            width: 38px;
            height: 38px;
            position: absolute;
            transform: rotate(-90deg);
        }
        .reticle-progress circle {
            fill: none;
            stroke: #3b82f6;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.05s linear;
        }
        /* Cardboard Split Divider */
        #vr-divider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            transform: translateX(-50%);
            z-index: 15;
            display: none;
        }
        .stereo-active #vr-divider {
            display: block;
        }
        /* Glow animations for UI */
        .glow-effect {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
    #ui-overlay{padding-top:max(1rem,env(safe-area-inset-top))}
    .webgl-error{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;background:#0d1117;color:#f8fafc;font:500 16px/1.6 system-ui,sans-serif}.webgl-error span{display:block;margin-top:.5rem;color:#94a3b8;font-size:13px}
    </style>
</head>

    <!-- Audio Synth Feedback Logic -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.fanOsc = null;
                this.fanGain = null;
                this.isFanPlaying = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            setFanSpeed(speed) { // 0, 1, 2, 3
                this.init();
                if (speed === 0) {
                    if (this.fanGain) {
                        this.fanGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2);
                    }
                    return;
                }

                if (!this.fanOsc) {
                    // Create fan noise simulation using low freq oscillator + noise
                    this.fanOsc = this.ctx.createOscillator();
                    this.fanGain = this.ctx.createGain();
                    this.fanOsc.type = 'triangle';
                    this.fanOsc.frequency.setValueAtTime(50, this.ctx.currentTime);
                    this.fanGain.gain.setValueAtTime(0, this.ctx.currentTime);
                    this.fanOsc.connect(this.fanGain);
                    this.fanGain.connect(this.ctx.destination);
                    this.fanOsc.start();
                }

                const targetFreq = 40 + speed * 25;
                const targetGain = 0.04 + speed * 0.02;
                this.fanOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.3);
                this.fanGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.3);
            }
        }

        const audioFX = new SoundFX();
    </script>

    <!-- Main 3D Three.js VR Application Logic -->
    <script>
        // Global App State
        const state = {
            isVR: false,
            isGyroAvailable: false,
            fanSpeed: 1, // 0: Off, 1: Low, 2: Med, 3: High
            fanOscillating: true,
            lampOn: true,
            roomLightOn: true,
            clockTime: 0
        };

        // DOM Elements
        const container = document.getElementById('webgl-container');
        const btnVR = document.getElementById('btn-vr');
        const btnRecenter = document.getElementById('btn-recenter');
        const statusText = document.getElementById('status-text');
        const gazeProgressCircle = document.getElementById('gaze-progress-circle');

        // Three.js Core Variables
        let scene, camera, renderer, stereoEffect;
        let orbitControls, deviceControls;
        let raycaster, centerVector;
        let interactiveObjects = [];

        // Dynamic Room Object References
        let fanBlades, fanHeadGroup;
        let deskLampLight, deskLampBulbMat;
        let clockSecondHand, clockMinuteHand, clockHourHand;

        // Gaze Interaction Variables
        let reticle3D, reticleFill, lastAlpha = null;
        let currentTarget = null;
        let gazeStartTime = 0;
        const GAZE_DURATION = 1500; // 1.5 seconds gaze trigger

        const clock = new THREE.Clock();

        function showWebGLError(error) {
            console.error('Não foi possível iniciar o WebGL:', error);
            container.innerHTML = `<div class="webgl-error"><strong>WebGL indisponível</strong><br><span>Ative a aceleração gráfica ou abra este arquivo em um navegador atualizado.</span></div>`;
            statusText.textContent = 'Erro: WebGL indisponível';
        }

        // Initialize Application
        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c10);
            scene.fog = new THREE.FogExp2(0x0a0c10, 0.02);

            // 2. Camera Setup (Positioned inside room facing desk & window)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.5, 2.2); // Ergonomic eye-level height in meters

            // 3. Renderer Setup
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            } catch (error) {
                showWebGLError(error);
                return;
            }
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
            // Compatível com versões antigas e novas do Three.js.
            if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
            else if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.physicallyCorrectLights = true;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            if (!renderer) return;
            container.appendChild(renderer.domElement);
            renderer.domElement.addEventListener('webglcontextlost', (event) => {
                event.preventDefault();
                statusText.textContent = 'WebGL pausado — recarregue a página';
            }, false);

            // Stereo Effect for Google Cardboard
            stereoEffect = new THREE.StereoEffect(renderer);
            stereoEffect.setSize(window.innerWidth, window.innerHeight);

            // 4. Controls Setup
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.maxPolarAngle = Math.PI - 0.05;
            orbitControls.minDistance = 0.1;
            orbitControls.maxDistance = 12;
            orbitControls.target.set(0, 1.1, -2.2);

            // Device Orientation Controls (Gyroscope), quando suportado pelo navegador.
            deviceControls = (THREE.DeviceOrientationControls) ? new THREE.DeviceOrientationControls(camera) : null;

            // 3D reticle (visible in Cardboard mode)
            scene.add(camera);
            const rMat = (c, o) => new THREE.MeshBasicMaterial({ color: c, depthTest: false, transparent: true, opacity: o });
            reticle3D = new THREE.Group();
            reticle3D.position.z = -1;
            reticle3D.visible = false;
            reticleFill = new THREE.Mesh(new THREE.CircleGeometry(0.02, 32), rMat(0x3b82f6, 0.9));
            reticleFill.scale.setScalar(0.001);
            const rRing = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.024, 32), rMat(0xffffff, 0.7));
            const rDot = new THREE.Mesh(new THREE.CircleGeometry(0.004, 16), rMat(0xffffff, 1));
            [reticleFill, rRing, rDot].forEach((m, i) => { m.renderOrder = 999 + i; reticle3D.add(m); });
            camera.add(reticle3D);

            // Raycaster for Gaze
            raycaster = new THREE.Raycaster();
            centerVector = new THREE.Vector2(0, 0);

            // 5. Build Procedural 3D Environment
            createLighting();
            createRoom();
            createBed();
            createDeskAndChair();
            createOscillatingFan();
            createDeskLamp();
            createBookshelf();
            createDecorations();
            createExtras();

            // 6. Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupDeviceOrientation();

            btnVR.addEventListener('click', toggleVRMode);
            btnRecenter.addEventListener('click', () => {
                recenterGyro();
            });

            // Touch / Click fallback trigger for non-gaze interaction
            window.addEventListener('pointerdown', onPointerDown);
        }

        function createLighting() {
            // Ambient soft lighting
            const ambientLight = new THREE.AmbientLight(0x52627d, 0.42);
            scene.add(ambientLight);
            scene.add(new THREE.HemisphereLight(0xc7d8ff, 0x3b2415, 0.5));

            // Main Room Ceiling Light
            const ceilingLight = new THREE.PointLight(0xffe3c2, 1.45, 14);
            ceilingLight.position.set(0, 2.7, 0);
            ceilingLight.castShadow = true;
            ceilingLight.shadow.mapSize.width = 1024;
            ceilingLight.shadow.mapSize.height = 1024;
            ceilingLight.shadow.bias = -0.002;
            scene.add(ceilingLight);

            // Moon/Window Light
            const windowLight = new THREE.DirectionalLight(0x7aa2f7, 0.8);
            windowLight.position.set(-3, 3, -4);
            scene.add(windowLight);
        }

        function createRoom() {
            const roomGroup = new THREE.Group();

            // Procedural Canvas Wood Floor Texture
            const floorCanvas = document.createElement('canvas');
            floorCanvas.width = 512;
            floorCanvas.height = 512;
            const ctx = floorCanvas.getContext('2d');
            ctx.fillStyle = '#4a2e1b';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#3b2313';
            for (let i = 0; i < 512; i += 32) {
                ctx.fillRect(0, i, 512, 2);
                for (let j = 0; j < 512; j += 64) {
                    ctx.fillRect((i % 64 === 0 ? j : j + 32), i, 2, 32);
                }
            }
            const floorTex = new THREE.CanvasTexture(floorCanvas);
            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(6, 6);
            floorTex.anisotropy = 8;

            // Materials
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.58, metalness: 0.04 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.96, metalness: 0.0 });
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x20252d, roughness: 1.0, metalness: 0.0 });

            // Room Dimensions: 4m wide, 3m high, 4m deep
            const roomWidth = 6, roomHeight = 3, roomDepth = 6;

            // Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            roomGroup.add(floor);

            // Ceiling
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), ceilingMat);
            ceiling.position.y = roomHeight;
            ceiling.rotation.x = Math.PI / 2;
            roomGroup.add(ceiling);

            // Back Wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomHeight), wallMat);
            backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
            backWall.receiveShadow = true;
            roomGroup.add(backWall);

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, roomHeight), wallMat);
            leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            roomGroup.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, roomHeight), wallMat);
            rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            roomGroup.add(rightWall);

            // Front Wall
            const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomHeight), wallMat);
            frontWall.position.set(0, roomHeight / 2, roomDepth / 2);
            frontWall.rotation.y = Math.PI;
            roomGroup.add(frontWall);

            // Window cutout simulation on back wall
            const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
            const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.4, 0.05), windowFrameMat);
            windowFrame.position.set(0, 1.8, -roomDepth / 2 + 0.02);

            // Outdoor Sky Backdrop Mesh
            const skyGeo = new THREE.PlaneGeometry(1.5, 1.1);
            const skyMat = new THREE.MeshBasicMaterial({ map: canvasTex(256, 192, (c, w, h) => {
                const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b1230'); gr.addColorStop(1, '#27406b');
                c.fillStyle = gr; c.fillRect(0, 0, w, h);
                for (let i = 0; i < 70; i++) { c.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.7})`; c.fillRect(Math.random() * w, Math.random() * h * 0.8, 1.5, 1.5); }
                c.fillStyle = '#0a0f1f'; c.fillRect(0, h * 0.86, w, h);
            }) }); // Deep night sky
            const skyMesh = new THREE.Mesh(skyGeo, skyMat);
            skyMesh.position.set(0, 1.8, -roomDepth / 2 + 0.05);

            // Moon in window
            const moonMesh = new THREE.Mesh(
                new THREE.CircleGeometry(0.15, 32),
                new THREE.MeshBasicMaterial({ color: 0xfef08a })
            );
            moonMesh.position.set(0.4, 2.1, -roomDepth / 2 + 0.055);

            roomGroup.add(windowFrame, skyMesh, moonMesh);
            scene.add(roomGroup);
        }

// ---------- Helpers de modelagem ----------
function canvasTex(w, h, draw, rx = 1, ry = 1) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
    return t;
}
function stdMat(o) { return new THREE.MeshStandardMaterial(o); }
function shadow(m) { m.castShadow = m.receiveShadow = true; return m; }
function box(p, w, h, d, m, x, y, z) { const o = shadow(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m)); o.position.set(x, y, z); p.add(o); return o; }
function cyl(p, rt, rb, h, m, x, y, z, seg = 20) { const o = shadow(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m)); o.position.set(x, y, z); p.add(o); return o; }
function rbox(w, h, d, r, mat) {
    const b = Math.min(r * 0.5, w / 4, h / 4, d / 4), sw = w - 2 * b, sh = h - 2 * b, rr = Math.min(r, sw / 2, sh / 2), x = -sw / 2, y = -sh / 2, S = new THREE.Shape();
    S.moveTo(x + rr, y); S.lineTo(x + sw - rr, y); S.quadraticCurveTo(x + sw, y, x + sw, y + rr);
    S.lineTo(x + sw, y + sh - rr); S.quadraticCurveTo(x + sw, y + sh, x + sw - rr, y + sh);
    S.lineTo(x + rr, y + sh); S.quadraticCurveTo(x, y + sh, x, y + sh - rr);
    S.lineTo(x, y + rr); S.quadraticCurveTo(x, y, x + rr, y);
    const g = new THREE.ExtrudeGeometry(S, { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 5 });
    g.center();
    return shadow(new THREE.Mesh(g, mat));
}
function woodMat(base, rx = 2, ry = 2) {
    return stdMat({ roughness: 0.5, map: canvasTex(256, 256, (c, w, h) => {
        c.fillStyle = base; c.fillRect(0, 0, w, h);
        for (let i = 0; i < 140; i++) {
            c.strokeStyle = `rgba(30,15,5,${Math.random() * 0.22})`; c.lineWidth = Math.random() * 2;
            c.beginPath(); c.moveTo(0, Math.random() * h);
            c.bezierCurveTo(w / 3, Math.random() * h, w * 2 / 3, Math.random() * h, w, Math.random() * h); c.stroke();
        }
    }, rx, ry) });
}
function makePlant(scale = 1) {
    const g = new THREE.Group();
    cyl(g, 0.11, 0.08, 0.16, stdMat({ color: 0xb45309, roughness: 0.8 }), 0, 0.08, 0);
    cyl(g, 0.1, 0.1, 0.02, stdMat({ color: 0x3b2a1a }), 0, 0.16, 0);
    const leafMat = stdMat({ color: 0x2f9e44, roughness: 0.7 });
    for (let i = 0; i < 16; i++) {
        const a = i * 2.4, tilt = 0.4 + (i % 4) * 0.2;
        const leaf = shadow(new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), leafMat));
        leaf.scale.set(0.45, 1.9, 0.12);
        leaf.position.set(Math.cos(a) * 0.07 * tilt, 0.3 + (i % 3) * 0.05, Math.sin(a) * 0.07 * tilt);
        leaf.rotation.set(Math.sin(a) * tilt, 0, -Math.cos(a) * tilt);
        g.add(leaf);
    }
    g.scale.setScalar(scale);
    return g;
}

function createBed() {
    const g = new THREE.Group();
    g.position.set(-2.1, 0, -2.0);
    const wood = woodMat('#7a5230');
    const fabric = stdMat({ color: 0xf1f5f9, roughness: 0.95 });
    const duvetTex = canvasTex(128, 128, (c, w, h) => {
        c.fillStyle = '#2f4f8f'; c.fillRect(0, 0, w, h);
        c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(0, 0, w, 14); c.fillRect(0, 0, 14, h);
        c.fillStyle = 'rgba(0,0,0,0.15)'; c.fillRect(0, 60, w, 8); c.fillRect(60, 0, 8, h);
        for (let i = 0; i < 1500; i++) { c.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`; c.fillRect(Math.random() * w, Math.random() * h, 1, 1); }
    }, 5, 5);
    const duvet = stdMat({ map: duvetTex, roughness: 0.95 });

        function setupDeviceOrientation() {
            if (!window.DeviceOrientationEvent) return;
            window.addEventListener('deviceorientation', (e) => {
                if (e.alpha !== null && e.alpha !== undefined) {
                    state.isGyroAvailable = true;
                    lastAlpha = e.alpha;
                }
            });
        }

        function recenterGyro() {
            if (deviceControls && lastAlpha !== null) deviceControls.alphaOffset = -THREE.MathUtils.degToRad(lastAlpha);
        }

        function toggleVRMode() {
            // Request iOS 13+ sensor permissions if needed
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        state.isGyroAvailable = permissionState === 'granted';
                        if (!state.isGyroAvailable) statusText.innerText = 'Modo: VR sem giroscópio';
                    })
                    .catch(() => {});
            }

            state.isVR = !state.isVR;
            audioFX.playClick();

            if (state.isVR) {
                // Request Fullscreen & Orientation Lock if supported
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }

                document.body.classList.add('stereo-active');
                statusText.innerText = "Modo: Google Cardboard VR";
                btnVR.innerHTML = `Sair do modo VR`;
                btnRecenter.classList.remove('hidden');
                setTimeout(recenterGyro, 300);
            } else {
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                document.body.classList.remove('stereo-active');
                statusText.innerText = "Modo: Janela / Órbita";
                btnVR.innerHTML = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm6 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg> Google Cardboard VR`;
                btnRecenter.classList.add('hidden');
                
                // Reset camera aspect
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            onWindowResize();
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            if (!camera || !renderer) return;
            camera.aspect = width / Math.max(height, 1);
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            if (stereoEffect) stereoEffect.setSize(width, height);
        }

        function checkGazeInteraction(deltaTime) {
            // Raycast from camera center
            raycaster.setFromCamera(centerVector, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                const hitObject = intersects[0].object;

                if (currentTarget !== hitObject) {
                    currentTarget = hitObject;
                    gazeStartTime = performance.now();
                } else {
                    // Calculate gaze dwell progress (0.0 to 1.0)
                    const elapsedTime = performance.now() - gazeStartTime;
                    const progress = Math.max(0, Math.min(elapsedTime / GAZE_DURATION, 1.0));

                    // Update UI Gaze Ring Progress Bar
                    const dashoffset = 100 - (progress * 100);
                    gazeProgressCircle.style.strokeDashoffset = dashoffset;

                    // Trigger action on 100% completion
                    if (progress >= 1.0) {
                        triggerObjectAction(currentTarget);
                        gazeStartTime = performance.now() + 1000; // Delay re-trigger
                        gazeProgressCircle.style.strokeDashoffset = 100;
                    }
                }
            } else {
                currentTarget = null;
                gazeProgressCircle.style.strokeDashoffset = 100;
            }
        }

        function onPointerDown(event) {
            // Ignore clicks on header UI buttons
            if (event.target.closest('#ui-overlay') || event.target.closest('#instructions-modal')) return;

            raycaster.setFromCamera(centerVector, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);
            if (intersects.length > 0) {
                triggerObjectAction(intersects[0].object);
            }
        }

        function triggerObjectAction(object) {
            audioFX.playClick();

            if (object.name === "fan_switch") {
                // Cycle Fan Speed: 0 -> 1 -> 2 -> 3 -> 0
                state.fanSpeed = (state.fanSpeed + 1) % 4;
                audioFX.setFanSpeed(state.fanSpeed);
            } else if (object.name === "lamp_switch") {
                // Toggle Desk Lamp
                state.lampOn = !state.lampOn;
                deskLampLight.visible = state.lampOn;
                deskLampBulbMat.color.setHex(state.lampOn ? 0xffedd5 : 0x444444);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 1. Controls Update
            if (state.isVR && state.isGyroAvailable && deviceControls) {
                deviceControls.update();
            } else {
                orbitControls.update();
            }

            // 2. Animate Oscillating Fan
            if (fanBlades && state.fanSpeed > 0) {
                // Rotate fan blades based on speed
                fanBlades.rotation.z += delta * state.fanSpeed * 18;

                // Side-to-side head oscillation
                if (state.fanOscillating) {
                    fanHeadGroup.rotation.y = Math.sin(time * 1.5) * 0.6;
                }
            }

            // 3. Animate Wall Clock Hands
            if (clockSecondHand) {
                const now = new Date();
                const secs = now.getSeconds() + now.getMilliseconds() / 1000;
                const mins = now.getMinutes() + secs / 60;
                const hrs = (now.getHours() % 12) + mins / 60;

                clockSecondHand.rotation.z = -secs * (Math.PI / 30);
                clockMinuteHand.rotation.z = -mins * (Math.PI / 30);
                clockHourHand.rotation.z = -hrs * (Math.PI / 6);
            }

            // 4. Update Reticle Gaze Raycasting
            checkGazeInteraction(delta);
            reticle3D.visible = state.isVR;
            reticleFill.scale.setScalar(Math.max((100 - parseFloat(gazeProgressCircle.style.strokeDashoffset || 100)) / 100, 0.001));

            // 5. Render Scene (Stereoscopic Split-Screen or Standard Single View)
            if (state.isVR) {
                stereoEffect.render(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
